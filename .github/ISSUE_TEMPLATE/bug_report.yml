name: Bug report
description: Report a reproducible problem without sharing private library data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach personal photos, exported journals, asset identifiers, filenames, or location data. Use synthetic examples where possible. Report security or data-loss vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "1.5 or commit SHA"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.6"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a backed-up test library and synthetic media when possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or context
      description: Remove all private media and library metadata before posting.
      render: shell
